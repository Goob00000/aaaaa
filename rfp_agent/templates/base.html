<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RFP Response Agent{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark navbar-expand-lg" style="background:#1F4E79;">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-file-earmark-text me-2"></i>RFP Agent</a>
    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link text-white" href="/"><i class="bi bi-house me-1"></i>Home</a>
      <a class="nav-link text-white" href="/library"><i class="bi bi-journal-text me-1"></i>Library</a>
    </div>
  </div>
</nav>

<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
